name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Verify dependencies
        run: go mod verify
      - name: Vet and test with race detector
        run: make check
      - name: Build
        run: make build
      - name: Demo smoke test
        run: ./bin/gonote --demo devoirs --json > /dev/null
      - name: Cross-compile
        run: |
          GOOS=darwin GOARCH=arm64 go build -trimpath -o /tmp/gonote-darwin ./cmd/gonote
          GOOS=windows GOARCH=amd64 go build -trimpath -o /tmp/gonote-windows.exe ./cmd/gonote
